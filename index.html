<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16223A">
<title>Roteiro de Viagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --papel:#EDF0EA;
  --papel2:#F7F8F4;
  --cartao:#FFFFFF;
  --tinta:#16223A;
  --tinta2:#5A6B84;
  --tinta3:#93A0B4;
  --linha:rgba(22,34,58,.12);
  --carimbo:#C8365B;
  --jade:#1F8F72;
  --ambar:#D9931A;
  --azul:#2C5C8F;
  --sombra:0 1px 2px rgba(22,34,58,.06), 0 8px 24px rgba(22,34,58,.07);
  --r:14px;
  --nav:74px;
}
[data-tema="noite"]{
  --papel:#0E1A24;
  --papel2:#132330;
  --cartao:#16293A;
  --tinta:#E7EDF3;
  --tinta2:#9DB0C2;
  --tinta3:#6D8296;
  --linha:rgba(231,237,243,.14);
  --carimbo:#F0708F;
  --jade:#39C79E;
  --ambar:#F0B23F;
  --azul:#7FB2E5;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.disp{font-family:Archivo,Inter,sans-serif;font-weight:800;letter-spacing:-.02em}
h1,h2,h3,h4{font-family:Archivo,Inter,sans-serif;margin:0;letter-spacing:-.015em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tinta);background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(44,92,143,.15)}
textarea{min-height:78px;resize:vertical}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--tinta2);margin:0 0 5px}
a{color:var(--azul)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:40;background:var(--papel);border-bottom:1px solid var(--linha)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:16px;line-height:1.1}
.top .sub{font-size:11px;color:var(--tinta2);letter-spacing:.08em;text-transform:uppercase}
.relogios{margin-left:auto;text-align:right}
.relogios .r1{font-size:16px;font-weight:700}
.relogios .r2{font-size:10px;color:var(--tinta3);letter-spacing:.06em}

.sec{margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--tinta2);font-weight:700}
.sec .risco{flex:1;height:1px;background:var(--linha)}

.card{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:14px}

/* Cartao de embarque */
.bp{position:relative;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.bp .faixa{height:5px;background:linear-gradient(90deg,var(--jade),var(--azul))}
.bp.espera .faixa{background:linear-gradient(90deg,var(--ambar),var(--carimbo))}
.bp .corpo{padding:16px 16px 12px}
.bp .eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
.pulso{width:7px;height:7px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 0 rgba(31,143,114,.6);animation:pulso 2s infinite}
.espera .pulso{background:var(--ambar);box-shadow:0 0 0 0 rgba(217,147,26,.6)}
@keyframes pulso{70%{box-shadow:0 0 0 9px rgba(31,143,114,0)}100%{box-shadow:0 0 0 0 rgba(31,143,114,0)}}
.bp h2.titulo{font-size:24px;line-height:1.12;margin:8px 0 2px}
.bp .trecho{display:flex;align-items:center;gap:9px;margin-top:10px}
.bp .pt{flex:1;min-width:0}
.bp .pt .hora{font-size:19px;font-weight:700;font-family:'Space Mono',monospace}
.bp .pt .lugar{font-size:12px;color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp .seta{color:var(--tinta3);font-size:15px}
.bp .pt.fim{text-align:right}
.perf{position:relative;border-top:2px dashed var(--linha);margin-top:14px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--papel);border:1px solid var(--linha)}
.perf::before{left:-11px}.perf::after{right:-11px}
.contagem{padding:13px 16px 4px;display:flex;align-items:flex-end;gap:12px}
.contagem .big{font-family:Archivo,sans-serif;font-weight:800;font-size:38px;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.contagem .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--tinta2);font-weight:700;padding-bottom:5px}
.barra{height:7px;background:var(--linha);border-radius:99px;overflow:hidden;margin:10px 16px 0}
.barra i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .9s linear}
.espera .barra i{background:var(--ambar)}
.mrz{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--tinta3);padding:9px 16px 13px;white-space:nowrap;overflow:hidden}

.acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.acao{display:block;text-decoration:none;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:11px 4px;text-align:center;box-shadow:var(--sombra);transition:transform .12s}
.acao:active{transform:scale(.95)}
.acao .ic{font-size:19px;display:block}
.acao .tx{font-size:10px;font-weight:600;color:var(--tinta2);margin-top:3px;display:block}

/* Lista de eventos */
.dia-cab{display:flex;align-items:center;gap:10px;margin:20px 0 8px;position:sticky;top:52px;z-index:20;background:var(--papel);padding:6px 0}
.dia-num{font-family:Archivo;font-weight:800;font-size:12px;background:var(--tinta);color:var(--papel);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
.dia-cab .dt{font-size:13px;font-weight:700}
.dia-cab .meta{margin-left:auto;font-size:11px;color:var(--tinta3)}

.ev{display:flex;gap:11px;padding:11px 12px;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;margin-bottom:7px;text-align:left;width:100%;position:relative;transition:transform .12s}
.ev:active{transform:scale(.99)}
.ev.agora{border-color:var(--jade);box-shadow:0 0 0 2px rgba(31,143,114,.16)}
.ev.feito{opacity:.62}
.ev .hh{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;width:44px;flex:0 0 44px;padding-top:1px}
.ev .hh small{display:block;font-size:9.5px;color:var(--tinta3);font-weight:400}
.ev .co{flex:1;min-width:0}
.ev .tt{font-weight:600;font-size:14.5px;line-height:1.25}
.ev .st{font-size:12px;color:var(--tinta2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--papel2);color:var(--tinta2);border:1px solid var(--linha);margin-top:6px}
.ev .dir{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--tinta3);font-size:11px}
.selo{color:var(--carimbo);border:2px solid var(--carimbo);border-radius:5px;font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;padding:1px 4px;transform:rotate(-7deg);letter-spacing:.06em;opacity:.85}
@keyframes carimbar{0%{transform:scale(2.4) rotate(9deg);opacity:0}60%{transform:scale(.92) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-7deg)}}
.selo.novo{animation:carimbar .45s cubic-bezier(.2,1.4,.4,1)}

.vazio{text-align:center;padding:44px 20px;color:var(--tinta2)}
.vazio .ic{font-size:34px;display:block;margin-bottom:10px;opacity:.5}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--linha);background:var(--cartao);white-space:nowrap}
.pill.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.filtros{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--tinta);color:var(--papel);border-radius:11px;padding:12px 16px;font-weight:700;font-size:14px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--cartao);color:var(--tinta);border:1px solid var(--linha)}
.btn.perigo{background:var(--carimbo);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.5}

.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--tinta);color:var(--papel);font-size:26px;box-shadow:0 8px 24px rgba(22,34,58,.3);z-index:45;display:flex;align-items:center;justify-content:center}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--cartao);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{padding:9px 2px 10px;text-align:center;color:var(--tinta3)}
nav button.on{color:var(--tinta)}
nav .ic{font-size:18px;display:block;line-height:1.2}
nav .tx{font-size:9.5px;font-weight:700;letter-spacing:.02em}

.folha{position:fixed;inset:0;z-index:80;background:rgba(10,16,26,.5);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.folha .in{background:var(--papel);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom));animation:sobe .26s cubic-bezier(.2,.9,.3,1)}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}}
.folha .cab{position:sticky;top:0;background:var(--papel);padding:14px 16px 10px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;z-index:2}
.folha .cab h3{font-size:16px;flex:1;min-width:0}
.folha .co{padding:14px 16px}
.puxador{width:38px;height:4px;border-radius:99px;background:var(--linha);margin:8px auto 0}

.campo{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.linha-info{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:14px}
.linha-info .k{flex:0 0 96px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta2);font-weight:700;padding-top:2px}
.linha-info .v{flex:1;min-width:0;word-break:break-word}

.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;background:var(--papel2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));background:var(--tinta);color:var(--papel);padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:90;box-shadow:var(--sombra);max-width:88vw;text-align:center}
#mapa{height:290px;border-radius:var(--r);overflow:hidden;border:1px solid var(--linha)}
.leaflet-container{background:var(--papel2);font-family:Inter,sans-serif}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--papel2);border:1px solid var(--linha);color:var(--tinta2);margin:0 5px 5px 0}
.item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.cx{width:23px;height:23px;flex:0 0 23px;border-radius:7px;border:2px solid var(--tinta3);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.cx.on{background:var(--jade);border-color:var(--jade);color:#fff}
.item.on .nm{text-decoration:line-through;color:var(--tinta3)}
.aviso{background:var(--papel2);border:1px dashed var(--linha);border-radius:11px;padding:12px;font-size:12.5px;color:var(--tinta2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:620px){.acoes{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   CONFIG  (unico bloco a editar por cliente / por viagem)
   ============================================================ */
const CONFIG = {
  marca: {
    nome: "Roteiro",
    assinatura: "Roteiro de Viagem",
  },
  viagemId: "viagem-tailandia-2026",
  // Deixe vazio para funcionar 100% offline (somente neste aparelho).
  // Preencha para sincronizar entre celulares, compartilhar link e localizacao ao vivo.
  firebase: {
    apiKey: "AIzaSyCyxOIYj6-QS40ExuV85w51XKMmm4FVHdE",
    authDomain: "roteiro-viagens-16284.firebaseapp.com",
    projectId: "roteiro-viagens-16284",
    storageBucket: "roteiro-viagens-16284.firebasestorage.app",
    messagingSenderId: "708665602825",
    appId: "1:708665602825:web:73a8424b5b6ec62c79d9d8"
  },
  // Cloudinary (upload sem assinatura). Sem isso, as fotos ficam so no aparelho.
  cloudinary: { cloudName: "qbahfnon", uploadPreset: "roteiro_viagem" },
  prefixo: "rt_"
};

/* ============================================================
   UTILITARIOS
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clienteId = uid();

const FUSOS = [
  { v: -300, n: "Acre / Nova York (-05)" }, { v: -240, n: "Manaus (-04)" }, { v: -180, n: "Brasilia (-03)" },
  { v: 0, n: "Londres / Lisboa (0)" }, { v: 60, n: "Europa / Marrocos (+01)" },
  { v: 120, n: "Grecia / Africa Sul (+02)" }, { v: 180, n: "Moscou / Istambul (+03)" },
  { v: 240, n: "Dubai / Muscat (+04)" }, { v: 300, n: "Paquistao (+05)" },
  { v: 330, n: "India (+05:30)" }, { v: 360, n: "Bangladesh (+06)" },
  { v: 420, n: "Tailandia / Vietna (+07)" }, { v: 480, n: "China / Singapura (+08)" },
  { v: 540, n: "Japao / Coreia (+09)" }, { v: 600, n: "Australia Leste (+10)" },
  { v: -420, n: "Los Angeles (-07)" }, { v: -360, n: "Cidade do Mexico (-06)" }
];
const fusoNome = (v) => (FUSOS.find(f => f.v === v) || {}).n || sigla(v);
const sigla = (v) => (v < 0 ? "-" : "+") + String(Math.floor(Math.abs(v) / 60)).padStart(2, "0") + (Math.abs(v) % 60 ? ":" + String(Math.abs(v) % 60).padStart(2, "0") : "");

const TIPOS = {
  voo: { n: "Voo", i: "\u2708\uFE0F" }, escala: { n: "Escala", i: "\u23F3" },
  transfer: { n: "Transfer", i: "\uD83D\uDE97" }, hotel: { n: "Hotel", i: "\uD83C\uDFE8" },
  passeio: { n: "Passeio", i: "\uD83D\uDDFA\uFE0F" }, refeicao: { n: "Refeicao", i: "\uD83C\uDF7D\uFE0F" },
  compras: { n: "Compras", i: "\uD83D\uDECD\uFE0F" }, praia: { n: "Praia", i: "\uD83C\uDFD6\uFE0F" },
  descanso: { n: "Descanso", i: "\uD83D\uDE34" }, livre: { n: "Livre", i: "\u2728" },
  evento: { n: "Evento", i: "\uD83C\uDF89" }
};

const hm2min = (s) => { if (!s) return 0; const p = String(s).split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
const min2hm = (m) => { m = Math.max(0, Math.round(m)); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const durTexto = (m) => { m = Math.max(0, Math.round(m)); const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60; if (d) return d + "d " + h + "h"; if (h) return h + "h" + (mi ? " " + mi + "min" : ""); return mi + "min"; };

// Instante absoluto (epoch ms) a partir de data + hora local + fuso do local
function inicioAbs(ev) {
  if (!ev.data || !ev.horaInicio) return null;
  const [y, m, d] = ev.data.split("-").map(Number);
  const [hh, mm] = ev.horaInicio.split(":").map(Number);
  return Date.UTC(y, m - 1, d, hh, mm) - (ev.tz || 0) * 60000;
}
const fimAbs = (ev) => { const i = inicioAbs(ev); return i == null ? null : i + (ev.duracaoMin || 0) * 60000; };

// Formata um instante absoluto no fuso informado
function fmtHora(abs, tz) {
  if (abs == null) return "--:--";
  const d = new Date(abs + (tz || 0) * 60000);
  return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0");
}
function fmtDataCurta(abs, tz) {
  if (abs == null) return "";
  const d = new Date(abs + (tz || 0) * 60000);
  return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0");
}
const DIAS = ["Domingo", "Segunda", "Terca", "Quarta", "Quinta", "Sexta", "Sabado"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
function dataExtenso(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return DIAS[dt.getUTCDay()] + ", " + String(d).padStart(2, "0") + " " + MESES[m - 1] + " " + y;
}
function addDias(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n));
  return dt.toISOString().slice(0, 10);
}
const hoje = () => new Date().toISOString().slice(0, 10);
const fusoLocalDispositivo = () => -new Date().getTimezoneOffset();

function contagem(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sg = s % 60;
  if (d > 0) return { a: d + "d " + h + "h", b: m + "min" };
  if (h > 0) return { a: h + "h " + String(m).padStart(2, "0") + "min", b: sg + "s" };
  return { a: m + "min " + String(sg).padStart(2, "0") + "s", b: "" };
}

/* ============================================================
   ARMAZENAMENTO
   local: sempre (funciona offline, no aviao)
   nuvem: opcional via Firebase (sincroniza celulares + link publico)
   fotos: Cloudinary se configurado, senao IndexedDB no aparelho
   ============================================================ */
const CHAVE = CONFIG.prefixo + "dados_" + CONFIG.viagemId;
let fb = null, dbf = null;
try {
  if (CONFIG.firebase && CONFIG.firebase.apiKey) {
    fb = firebase.apps.length ? firebase.app() : firebase.initializeApp(CONFIG.firebase);
    dbf = firebase.firestore();
  }
} catch (e) { console.warn("Firebase indisponivel", e); }

// IndexedDB para fotos locais
const IDB = {
  db: null,
  abrir() {
    return new Promise((res, rej) => {
      if (IDB.db) return res(IDB.db);
      const r = indexedDB.open(CONFIG.prefixo + "fotos", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("f"); };
      r.onsuccess = () => { IDB.db = r.result; res(IDB.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async set(k, v) { const db = await IDB.abrir(); return new Promise(r => { const t = db.transaction("f", "readwrite"); t.objectStore("f").put(v, k); t.oncomplete = r; }); },
  async get(k) { const db = await IDB.abrir(); return new Promise(r => { const t = db.transaction("f", "readonly"); const q = t.objectStore("f").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); },
  async del(k) { const db = await IDB.abrir(); return new Promise(r => { const t = db.transaction("f", "readwrite"); t.objectStore("f").delete(k); t.oncomplete = r; }); }
};

async function comprimir(file, max) {
  max = max || 1400;
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return null;
  const esc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * esc); c.height = Math.round(bmp.height * esc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b), "image/jpeg", 0.82));
}
async function enviarFoto(file) {
  const blob = await comprimir(file);
  if (!blob) return null;
  const cn = CONFIG.cloudinary || {};
  if (cn.cloudName && cn.uploadPreset) {
    const fd = new FormData();
    fd.append("file", blob); fd.append("upload_preset", cn.uploadPreset);
    const r = await fetch("https://api.cloudinary.com/v1_1/" + cn.cloudName + "/image/upload", { method: "POST", body: fd });
    const j = await r.json();
    if (j.secure_url) return { url: j.secure_url, remoto: true };
  }
  const k = "f_" + uid();
  await IDB.set(k, blob);
  return { chave: k, remoto: false };
}
function urlFoto(f, cache, setCache) {
  if (f.url) return f.url;
  if (cache[f.chave]) return cache[f.chave];
  IDB.get(f.chave).then(b => { if (b) setCache(c => Object.assign({}, c, { [f.chave]: URL.createObjectURL(b) })); });
  return null;
}

function Campo({ rot, children }) {
  return <div className="campo"><label>{rot}</label>{children}</div>;
}
function Linha({ k, children }) {
  if (!children) return null;
  return <div className="linha-info"><div className="k">{k}</div><div className="v">{children}</div></div>;
}
function Folha({ titulo, onFechar, children, acao, protegido }) {
  const prot = useRef(protegido);
  prot.current = protegido;
  const tentarFechar = useCallback(() => {
    if (prot.current && !confirm("Sair sem salvar? O que voce digitou fica guardado como rascunho.")) return;
    onFechar();
  }, [onFechar]);
  useEffect(() => {
    const f = e => { if (e.key === "Escape") tentarFechar(); };
    window.addEventListener("keydown", f);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", f); document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="folha" onClick={e => { if (e.target === e.currentTarget) tentarFechar(); }}>
      <div className="in">
        <div className="puxador"></div>
        <div className="cab">
          <h3>{titulo}</h3>
          {acao}
          <button className="pill" onClick={tentarFechar}>Fechar</button>
        </div>
        <div className="co">{children}</div>
      </div>
    </div>
  );
}

function CartaoEmbarque({ evento, agora, proximo, onAbrir, dispositivoTz, modoRelogio }) {
  if (!evento && !proximo) {
    return <div className="card pad vazio"><span className="ic">{"\u2708\uFE0F"}</span>Nenhum evento programado.<br />Comece adicionando o primeiro no Roteiro.</div>;
  }
  const alvo = evento || proximo;
  const emCurso = !!evento;
  const ini = inicioAbs(alvo), fim = fimAbs(alvo);
  const tzI = modoRelogio === "casa" ? dispositivoTz : alvo.tz;
  const tzF = modoRelogio === "casa" ? dispositivoTz : (alvo.tzFim != null ? alvo.tzFim : alvo.tz);
  const restante = emCurso ? fim - agora : ini - agora;
  const c = contagem(restante);
  const pct = emCurso && alvo.duracaoMin ? Math.min(100, Math.max(0, ((agora - ini) / (alvo.duracaoMin * 60000)) * 100)) : 0;
  const t = TIPOS[alvo.tipo] || TIPOS.livre;
  const mrz = ("<" + (alvo.cidade || "ROTEIRO") + "<D" + String(alvo.dia).padStart(2, "0") + "<" + t.n + "<" + fmtDataCurta(ini, tzI) + "<").toUpperCase().replace(/\s/g, "<") + "<<<<<<<<<<<<<<<<<<<<";
  return (
    <div className={"bp" + (emCurso ? "" : " espera")}>
      <div className="faixa"></div>
      <div className="corpo" onClick={onAbrir} role="button">
        <div className="eyebrow"><span className="pulso"></span>{emCurso ? "Acontecendo agora" : "Proximo evento"}<span style={{ marginLeft: "auto", letterSpacing: ".04em" }}>{t.i} {t.n}</span></div>
        <h2 className="titulo">{alvo.titulo}</h2>
        <div className="trecho">
          <div className="pt">
            <div className="hora">{fmtHora(ini, tzI)}</div>
            <div className="lugar">{alvo.localInicio || alvo.cidade || "-"}</div>
          </div>
          <div className="seta">{"\u2500\u2500\u2192"}</div>
          <div className="pt fim">
            <div className="hora">{fmtHora(fim, tzF)}</div>
            <div className="lugar">{alvo.localFim || alvo.cidade || "-"}</div>
          </div>
        </div>
      </div>
      <div className="perf"></div>
      <div className="contagem">
        <div className="big">{c.a}</div>
        <div className="lbl">{emCurso ? "para terminar" : "para comecar"}</div>
      </div>
      <div className="barra"><i style={{ width: (emCurso ? pct : 100) + "%" }}></i></div>
      <div className="mrz">{mrz.slice(0, 44)}</div>
    </div>
  );
}

function AbaAgora({ dados, agora, acoes, ui }) {
  const { eventos } = dados;
  const ordenados = useMemo(() => eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0)), [eventos]);
  const atual = ordenados.find(e => { const i = inicioAbs(e), f = fimAbs(e); return i != null && agora >= i && agora < f && e.status !== "cancelado"; });
  const proximo = ordenados.find(e => { const i = inicioAbs(e); return i != null && i > agora && e.status !== "cancelado"; });
  const foco = atual || proximo;
  const dtz = fusoLocalDispositivo();
  const dia = foco ? ordenados.filter(e => e.dia === foco.dia) : [];
  const fotosEv = foco ? dados.fotos.filter(f => f.eventoId === foco.id) : [];
  const depois = proximo && atual ? proximo : ordenados.filter(e => { const i = inicioAbs(e); return i != null && i > agora; })[atual ? 0 : 1];

  return (
    <div className="wrap">
      <div style={{ height: 14 }}></div>
      <CartaoEmbarque evento={atual} proximo={proximo} agora={agora} onAbrir={() => foco && acoes.abrirEvento(foco)} dispositivoTz={dtz} modoRelogio={ui.modoRelogio} />

      {foco && (
        <div className="acoes">
          <button className="acao" onClick={() => acoes.checkin(foco)}><span className="ic">{"\uD83D\uDCCD"}</span><span className="tx">Check-in</span></button>
          <button className="acao" onClick={() => acoes.pedirFoto(foco)}><span className="ic">{"\uD83D\uDCF7"}</span><span className="tx">Foto</span></button>
          <button className="acao" onClick={() => acoes.abrirMapa(foco)}><span className="ic">{"\uD83E\uDDED"}</span><span className="tx">Mapa</span></button>
          <button className="acao" onClick={() => acoes.ligar(foco)}><span className="ic">{"\uD83D\uDCDE"}</span><span className="tx">Contato</span></button>
          <button className="acao" onClick={() => acoes.abrirEvento(foco)}><span className="ic">{"\uD83D\uDC57"}</span><span className="tx">Look</span></button>
          <button className="acao" onClick={() => acoes.anotar(foco)}><span className="ic">{"\u270D\uFE0F"}</span><span className="tx">Anotar</span></button>
          <button className="acao" onClick={() => acoes.concluir(foco)}><span className="ic">{"\u2705"}</span><span className="tx">Concluir</span></button>
          <button className="acao" onClick={() => acoes.irPara("roteiro")}><span className="ic">{"\uD83D\uDCC5"}</span><span className="tx">Roteiro</span></button>
        </div>
      )}

      {foco && (foco.looks && Object.keys(foco.looks).some(k => foco.looks[k])) && (
        <>
          <div className="sec"><h2>Look de hoje</h2><div className="risco"></div></div>
          <div className="card pad">
            {dados.viagem.viajantes.map(v => foco.looks[v.id] ? (
              <div key={v.id} style={{ marginBottom: 8 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".08em", textTransform: "uppercase", color: "var(--tinta2)" }}>{v.nome}</div>
                <div>{foco.looks[v.id]}</div>
              </div>
            ) : null)}
          </div>
        </>
      )}

      {foco && foco.obs && (
        <>
          <div className="sec"><h2>Observacoes</h2><div className="risco"></div></div>
          <div className="card pad" style={{ whiteSpace: "pre-wrap" }}>{foco.obs}</div>
        </>
      )}

      {fotosEv.length > 0 && (
        <>
          <div className="sec"><h2>Fotos deste momento</h2><div className="risco"></div></div>
          <Galeria fotos={fotosEv} />
        </>
      )}

      {depois && (
        <>
          <div className="sec"><h2>Depois disso</h2><div className="risco"></div></div>
          <ItemEvento e={depois} agora={agora} onClick={() => acoes.abrirEvento(depois)} modoRelogio={ui.modoRelogio} dtz={dtz} />
        </>
      )}

      {dia.length > 0 && (
        <>
          <div className="sec"><h2>Dia {foco.dia} completo</h2><div className="risco"></div><span style={{ fontSize: 11, color: "var(--tinta3)" }}>{dataExtenso(foco.data)}</span></div>
          {dia.map(e => <ItemEvento key={e.id} e={e} agora={agora} onClick={() => acoes.abrirEvento(e)} modoRelogio={ui.modoRelogio} dtz={dtz} />)}
        </>
      )}

    </div>
  );

function Galeria({ fotos }) {
  const [cache, setCache] = useState({});
  return (
    <div className="fotos">
      {fotos.map(f => {
        const u = urlFoto(f, cache, setCache);
        return u ? <img key={f.id} src={u} alt={f.legenda || "foto"} loading="lazy" /> : <div key={f.id} style={{ aspectRatio: 1, borderRadius: 9, background: "var(--papel2)" }}></div>;
      })}
    </div>
  );
}

function ItemEvento({ e, agora, onClick, modoRelogio, dtz }) {
  const i = inicioAbs(e), f = fimAbs(e);
  const emCurso = i != null && agora >= i && agora < f;
  const feito = e.status === "concluido" || (f != null && agora >= f);
  const tz = modoRelogio === "casa" ? dtz : e.tz;
  const t = TIPOS[e.tipo] || TIPOS.livre;
  const sub = [e.localInicio, e.localFim].filter(Boolean).join(" \u2192 ") || e.cidade || "";
  return (
    <button className={"ev" + (emCurso ? " agora" : "") + (feito && !emCurso ? " feito" : "")} onClick={onClick}>
      <div className="hh">{fmtHora(i, tz)}<small>{durTexto(e.duracaoMin)}</small></div>
      <div className="co">
        <div className="tt">{t.i} {e.titulo}</div>
        {sub && <div className="st">{sub}</div>}
        {e.reserva && <span className="tag">Reserva {e.reserva}</span>}
      </div>
      <div className="dir">
        {emCurso && <span className="selo" style={{ color: "var(--jade)", borderColor: "var(--jade)" }}>AGORA</span>}
        {e.checkin && <span className="selo">VISITADO</span>}
        {e.status === "cancelado" && <span className="selo">CANCELADO</span>}
      </div>
    </button>
  );
}

/* ------------------ ABA ROTEIRO ------------------ */
function AbaRoteiro({ dados, agora, acoes, ui, setUi }) {
  const [busca, setBusca] = useState("");
  const dtz = fusoLocalDispositivo();
  const ordenados = useMemo(() => dados.eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0)), [dados.eventos]);
  const dias = useMemo(() => {
    const m = {};
    ordenados.forEach(e => { const k = e.dia + "|" + e.data; (m[k] = m[k] || []).push(e); });
    return Object.keys(m).sort((a, b) => (+a.split("|")[0]) - (+b.split("|")[0])).map(k => ({ dia: +k.split("|")[0], data: k.split("|")[1], itens: m[k] }));
  }, [ordenados]);

  const filtrados = dias.map(d => ({
    ...d,
    itens: d.itens.filter(e => {
      if (ui.filtroTipo !== "todos" && e.tipo !== ui.filtroTipo) return false;
      if (busca) { const t = (e.titulo + " " + e.cidade + " " + e.localInicio + " " + e.localFim + " " + e.obs).toLowerCase(); if (!t.includes(busca.toLowerCase())) return false; }
      return true;
    })
  })).filter(d => d.itens.length);

  const visiveis = ui.visao === "dia"
    ? filtrados.filter(d => d.dia === ui.diaFoco)
    : ui.visao === "semana"
      ? filtrados.filter(d => Math.floor(d.dia / 7) === Math.floor(ui.diaFoco / 7))
      : filtrados;

  const custoTotal = dados.eventos.reduce((s, e) => s + (parseFloat(String(e.custo).replace(",", ".")) || 0), 0);

  return (
    <div className="wrap">
      <div style={{ height: 12 }}></div>
      <div className="filtros">
        {[["tudo", "Viagem toda"], ["semana", "Semana"], ["dia", "Dia"]].map(([v, n]) =>
          <button key={v} className={"pill" + (ui.visao === v ? " on" : "")} onClick={() => setUi(u => ({ ...u, visao: v }))}>{n}</button>)}
        <button className={"pill" + (ui.filtroTipo !== "todos" ? " on" : "")} onClick={() => setUi(u => ({ ...u, filtroTipo: "todos" }))}>{ui.filtroTipo === "todos" ? "Todos os tipos" : "Limpar filtro"}</button>
        {Object.keys(TIPOS).map(k => <button key={k} className={"pill" + (ui.filtroTipo === k ? " on" : "")} onClick={() => setUi(u => ({ ...u, filtroTipo: k }))}>{TIPOS[k].i} {TIPOS[k].n}</button>)}
      </div>

      {ui.visao !== "tudo" && (
        <div className="filtros" style={{ marginTop: 6 }}>
          {dias.map(d => <button key={d.dia} className={"pill" + (ui.visao === "dia" ? (ui.diaFoco === d.dia ? " on" : "") : (Math.floor(ui.diaFoco / 7) === Math.floor(d.dia / 7) ? " on" : ""))} onClick={() => setUi(u => ({ ...u, diaFoco: d.dia }))}>D{d.dia}</button>)}
        </div>
      )}

      <div style={{ marginTop: 10 }}>
        <input placeholder="Buscar evento, cidade, local..." value={busca} onChange={e => setBusca(e.target.value)} />
      </div>

      <div className="sec"><h2>{visiveis.reduce((s, d) => s + d.itens.length, 0)} eventos</h2><div className="risco"></div>
        {custoTotal > 0 && <span style={{ fontSize: 11, color: "var(--tinta3)" }}>Custos: {custoTotal.toFixed(2)}</span>}
      </div>

      {visiveis.length === 0 && <div className="card pad vazio"><span className="ic">{"\uD83D\uDCC5"}</span>Nada aqui ainda. Toque em + para adicionar um evento.</div>}

      {visiveis.map(d => (
        <div key={d.dia + d.data}>
          <div className="dia-cab">
            <span className="dia-num">DIA {d.dia}</span>
            <span className="dt">{dataExtenso(d.data)}</span>
            <span className="meta">{d.itens.length} evento{d.itens.length > 1 ? "s" : ""}</span>
          </div>
          {d.itens.map(e => <ItemEvento key={e.id} e={e} agora={agora} onClick={() => acoes.abrirEvento(e)} modoRelogio={ui.modoRelogio} dtz={dtz} />)}
        </div>
      ))}
      <div style={{ height: 30 }}></div>
    </div>
  );
}

/* ------------------ FORMULARIO DE EVENTO ------------------ */
const CHAVE_RASCUNHO = CONFIG.prefixo + "rascunho_" + CONFIG.viagemId;
function lerRascunho(id) {
  try { const r = JSON.parse(localStorage.getItem(CHAVE_RASCUNHO) || "null"); return (r && r.id === id) ? r : null; } catch (e) { return null; }
}
function FormEvento({ evento, dados, onSalvar, onExcluir, onFechar }) {
  const rascunho = useMemo(() => lerRascunho(evento.id), []);
  const [f, setF] = useState(() => ev(Object.assign({}, evento, rascunho || {})));
  const [temRascunho, setTemRascunho] = useState(!!rascunho);
  const set = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
  useEffect(() => { try { localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify(f)); } catch (e) { } }, [f]);
  useEffect(() => {
    const g = e => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", g);
    return () => window.removeEventListener("beforeunload", g);
  }, []);
  const descartar = () => {
    if (!confirm("Descartar o rascunho e voltar ao que estava salvo?")) return;
    localStorage.removeItem(CHAVE_RASCUNHO); setF(ev(Object.assign({}, evento))); setTemRascunho(false);
  };
  const setLook = (id, v) => setF(p => Object.assign({}, p, { looks: Object.assign({}, p.looks, { [id]: v }) }));
  const durDias = Math.floor((f.duracaoMin || 0) / 1440);
  const dur = min2hm((f.duracaoMin || 0) % 1440);
  const ini = inicioAbs(f), fim = fimAbs(f);
  const tzF = f.tzFim != null ? f.tzFim : f.tz;

  useEffect(() => {
    if (f.data && dados.viagem.inicio) {
      const d0 = new Date(dados.viagem.inicio + "T00:00:00Z").getTime();
      const d1 = new Date(f.data + "T00:00:00Z").getTime();
      const n = Math.round((d1 - d0) / 86400000);
      if (n >= 0 && n !== f.dia) set("dia", n);
    }
  }, [f.data]);

  return (
    <Folha titulo={evento.titulo ? "Editar evento" : "Novo evento"} onFechar={onFechar} protegido={true}
      acao={<button className="pill on" onClick={() => onSalvar(f)}>Salvar</button>}>
      {temRascunho && (
        <div className="aviso" style={{ marginBottom: 14, display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ flex: 1 }}>Recuperei o que voce estava digitando antes de sair.</span>
          <button className="pill" onClick={descartar}>Descartar</button>
        </div>
      )}
      <Campo rot="Titulo do evento">
        <input value={f.titulo} onChange={e => set("titulo", e.target.value)} placeholder="Ex: Templo Wat Arun" autoFocus />
      </Campo>
      <div className="grid2">
        <Campo rot="Tipo">
          <select value={f.tipo} onChange={e => set("tipo", e.target.value)}>
            {Object.keys(TIPOS).map(k => <option key={k} value={k}>{TIPOS[k].i} {TIPOS[k].n}</option>)}
          </select>
        </Campo>
        <Campo rot="Data">
          <input type="date" value={f.data} onChange={e => set("data", e.target.value)} />
        </Campo>
      </div>
      <div className="grid3">
        <Campo rot="Inicio"><input type="time" value={f.horaInicio} onChange={e => set("horaInicio", e.target.value)} /></Campo>
        <Campo rot="Duracao"><input type="time" value={dur} onChange={e => set("duracaoMin", durDias * 1440 + hm2min(e.target.value))} /></Campo>
        <Campo rot="Mais dias"><input type="number" min="0" value={durDias} onChange={e => set("duracaoMin", (+e.target.value || 0) * 1440 + hm2min(dur))} /></Campo>
      </div>
      <div className="grid2">
        <Campo rot="Fuso do inicio">
          <select value={f.tz} onChange={e => set("tz", +e.target.value)}>{FUSOS.map(x => <option key={x.n} value={x.v}>{x.n}</option>)}</select>
        </Campo>
        <Campo rot="Fuso do fim">
          <select value={tzF} onChange={e => set("tzFim", +e.target.value)}>{FUSOS.map(x => <option key={x.n} value={x.v}>{x.n}</option>)}</select>
        </Campo>
      </div>
      <div className="aviso" style={{ marginBottom: 14 }}>
        Termina as <b>{fmtHora(fim, tzF)}</b> de {fmtDataCurta(fim, tzF)} no horario de {fusoNome(tzF)}.
        {f.tz !== tzF && <> Voce ganha ou perde {durTexto(Math.abs(tzF - f.tz))} ao cruzar o fuso.</>}
      </div>

      <div className="grid2">
        <Campo rot="Local de inicio"><input value={f.localInicio} onChange={e => set("localInicio", e.target.value)} placeholder="Saida" /></Campo>
        <Campo rot="Local de fim"><input value={f.localFim} onChange={e => set("localFim", e.target.value)} placeholder="Chegada" /></Campo>
      </div>
      <Campo rot="Cidade"><input value={f.cidade} onChange={e => set("cidade", e.target.value)} /></Campo>
      <Campo rot="Endereco"><input value={f.endereco} onChange={e => set("endereco", e.target.value)} placeholder="Rua, numero, bairro" /></Campo>
      <Campo rot="Link do Google Maps">
        <input value={f.mapsUrl} onChange={e => set("mapsUrl", e.target.value)} placeholder="Cole o link ou deixe vazio para buscar pelo endereco" />
      </Campo>

      <div className="sec"><h2>Contato do local</h2><div className="risco"></div></div>
      <div className="grid2">
        <Campo rot="Nome"><input value={f.contatoNome} onChange={e => set("contatoNome", e.target.value)} placeholder="Hotel, guia, restaurante" /></Campo>
        <Campo rot="Telefone"><input value={f.contatoFone} onChange={e => set("contatoFone", e.target.value)} placeholder="+66 ..." /></Campo>
      </div>
      <Campo rot="Site ou WhatsApp"><input value={f.contatoSite} onChange={e => set("contatoSite", e.target.value)} /></Campo>

      <div className="sec"><h2>Reserva e custo</h2><div className="risco"></div></div>
      <div className="grid3">
        <Campo rot="Localizador"><input value={f.reserva} onChange={e => set("reserva", e.target.value)} /></Campo>
        <Campo rot="Custo"><input value={f.custo} onChange={e => set("custo", e.target.value)} placeholder="0,00" /></Campo>
        <Campo rot="Moeda"><input value={f.moeda} onChange={e => set("moeda", e.target.value)} /></Campo>
      </div>

      <div className="sec"><h2>Look de cada um</h2><div className="risco"></div></div>
      {dados.viagem.viajantes.map(v => (
        <Campo key={v.id} rot={v.nome}>
          <input value={f.looks[v.id] || ""} onChange={e => setLook(v.id, e.target.value)} placeholder="Camiseta, calca, tenis..." />
        </Campo>
      ))}

      <Campo rot="Observacoes">
        <textarea value={f.obs} onChange={e => set("obs", e.target.value)} placeholder="Tudo que voce quer lembrar na hora" />
      </Campo>

      <Campo rot="Status">
        <select value={f.status} onChange={e => set("status", e.target.value)}>
          <option value="previsto">Previsto</option><option value="concluido">Concluido</option><option value="cancelado">Cancelado</option>
        </select>
      </Campo>

      <button className="btn full" onClick={() => onSalvar(f)}>Salvar evento</button>
      {evento.titulo && (
        <button className="btn sec full" style={{ marginTop: 8, color: "var(--carimbo)" }} onClick={() => { if (confirm("Excluir este evento?")) onExcluir(f.id); }}>Excluir evento</button>
      )}
      <div style={{ height: 10 }}></div>
    </Folha>
  );
}

/* ------------------ DETALHE DO EVENTO ------------------ */
function DetalheEvento({ e, dados, agora, acoes, onFechar, onEditar, modoRelogio }) {
  const dtz = fusoLocalDispositivo();
  const tzI = modoRelogio === "casa" ? dtz : e.tz;
  const tzF = modoRelogio === "casa" ? dtz : (e.tzFim != null ? e.tzFim : e.tz);
  const ini = inicioAbs(e), fim = fimAbs(e);
  const emCurso = ini != null && agora >= ini && agora < fim;
  const t = TIPOS[e.tipo] || TIPOS.livre;
  const fotos = dados.fotos.filter(f => f.eventoId === e.id);
  const maps = e.mapsUrl || (e.endereco || e.localFim || e.cidade ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([e.endereco, e.localFim || e.localInicio, e.cidade].filter(Boolean).join(", ")) : "");
  return (
    <Folha titulo={e.titulo} onFechar={onFechar} acao={<button className="pill" onClick={onEditar}>Editar</button>}>
      <div className="card pad" style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div style={{ fontSize: 26 }}>{t.i}</div>
          <div style={{ flex: 1 }}>
            <div className="mono" style={{ fontSize: 17, fontWeight: 700 }}>{fmtHora(ini, tzI)} {"\u2192"} {fmtHora(fim, tzF)}</div>
            <div style={{ fontSize: 12, color: "var(--tinta2)" }}>Dia {e.dia} {"\u00B7"} {dataExtenso(e.data)} {"\u00B7"} {durTexto(e.duracaoMin)}</div>
          </div>
        </div>
        {emCurso && <div className="barra" style={{ margin: "12px 0 0" }}><i style={{ width: Math.min(100, ((agora - ini) / (e.duracaoMin * 60000)) * 100) + "%" }}></i></div>}
        {emCurso && <div style={{ fontSize: 12, color: "var(--tinta2)", marginTop: 6 }}>Faltam {contagem(fim - agora).a} para terminar</div>}
        {!emCurso && ini > agora && <div style={{ fontSize: 12, color: "var(--tinta2)", marginTop: 8 }}>Comeca em {contagem(ini - agora).a}</div>}
      </div>

      <div className="acoes" style={{ marginBottom: 14 }}>
        <button className="acao" onClick={() => acoes.checkin(e)}><span className="ic">{"\uD83D\uDCCD"}</span><span className="tx">Check-in</span></button>
        <button className="acao" onClick={() => acoes.pedirFoto(e)}><span className="ic">{"\uD83D\uDCF7"}</span><span className="tx">Foto</span></button>
        {maps && <a className="acao" href={maps} target="_blank" rel="noopener"><span className="ic">{"\uD83E\uDDED"}</span><span className="tx">Mapa</span></a>}
        {e.contatoFone && <a className="acao" href={"tel:" + e.contatoFone}><span className="ic">{"\uD83D\uDCDE"}</span><span className="tx">Ligar</span></a>}
      </div>

      <Linha k="Trajeto">{[e.localInicio, e.localFim].filter(Boolean).join(" \u2192 ")}</Linha>
      <Linha k="Cidade">{e.cidade}</Linha>
      <Linha k="Endereco">{e.endereco}</Linha>
      <Linha k="Fuso">{fusoNome(e.tz)}{e.tzFim != null && e.tzFim !== e.tz ? " para " + fusoNome(e.tzFim) : ""}</Linha>
      <Linha k="Contato">{e.contatoNome || e.contatoFone ? (e.contatoNome + (e.contatoFone ? " " + e.contatoFone : "")) : ""}</Linha>

/* ------------------ ABA DIARIO / STORIES ------------------ */
function legendaDoDia(dia, eventos, viagem) {
  const evs = eventos.filter(e => e.dia === dia && e.status !== "cancelado");
  if (!evs.length) return "";
  const cidades = [...new Set(evs.map(e => e.cidade).filter(Boolean))];
  const destaques = evs.filter(e => !["escala", "descanso"].includes(e.tipo)).slice(0, 6);
  const linhas = destaques.map(e => (TIPOS[e.tipo] || TIPOS.livre).i + " " + e.titulo + (e.cidade && !e.titulo.includes(e.cidade) ? " em " + e.cidade : ""));
  const tags = ["#" + (viagem.nome || "viagem").replace(/[^a-zA-Z0-9]/g, ""), ...cidades.map(c => "#" + c.replace(/[^a-zA-Z0-9]/g, ""))];
  const notas = evs.filter(e => e.nota).map(e => e.nota);
  return "Dia " + dia + (cidades.length ? " em " + cidades.join(" e ") : "") + "\n\n"
    + linhas.join("\n") + "\n"
    + (notas.length ? "\n" + notas.join("\n") + "\n" : "")
    + "\n" + tags.slice(0, 8).join(" ");
}

function AbaDiario({ dados, acoes }) {

    dados.eventos.forEach(e => { (m[e.dia] = m[e.dia] || { dia: e.dia, data: e.data, evs: [] }).evs.push(e); });
    return Object.values(m).sort((a, b) => a.dia - b.dia);
  }, [dados.eventos]);
  const comRegistro = dias.filter(d => dados.fotos.some(f => d.evs.some(e => e.id === f.eventoId)) || d.evs.some(e => e.nota || e.checkin));

        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <button className="btn sec" style={{ flex: 1 }} onClick={acoes.exportarDiario}>Exportar diario</button>

      {comRegistro.length === 0 && <div className="card pad vazio" style={{ marginTop: 14 }}><span className="ic">{"\uD83D\uDCD6"}</span>Ainda sem registros. Durante a viagem, use Foto e Anotar na aba Agora.</div>}

      {comRegistro.map(d => {
        const fotos = dados.fotos.filter(f => d.evs.some(e => e.id === f.eventoId));
        const notas = d.evs.filter(e => e.nota);
        const leg = legendaDoDia(d.dia, dados.eventos, dados.viagem);
        return (

            </div>

            {notas.map(e => (
              <div key={e.id} className="pad" style={{ borderTop: "1px solid var(--linha)" }}>
                <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".08em", color: "var(--tinta2)" }}>{e.titulo}</div>
                <div style={{ whiteSpace: "pre-wrap", marginTop: 3 }}>{e.nota}</div>

            </div>
          </div>
        );
      })}

    </div>
  );

/* ------------------ ABA MALA ------------------ */
function AbaMala({ dados, salvar, acoes }) {
  const [novo, setNovo] = useState("");
  const [cat, setCat] = useState("Roupas");
  const cats = [...new Set([...dados.mala.map(i => i.cat), "Documentos", "Roupas", "Higiene", "Eletronicos", "Saude", "Praia", "Outros"])];
  const feitos = dados.mala.filter(i => i.ok).length;
  const add = () => {
    if (!novo.trim()) return;
    salvar(d => ({ ...d, mala: [...d.mala, { id: uid(), cat, nome: novo.trim(), quem: "todos", ok: false }] }));
    setNovo("");
  };
  const alternar = id => salvar(d => ({ ...d, mala: d.mala.map(i => i.id === id ? { ...i, ok: !i.ok } : i) }));
  const remover = id => salvar(d => ({ ...d, mala: d.mala.filter(i => i.id !== id) }));

  return (
    <div className="wrap">
      <div style={{ height: 12 }}></div>
      <div className="card pad">
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <div className="disp" style={{ fontSize: 30 }}>{feitos}<span style={{ fontSize: 16, color: "var(--tinta3)" }}>/{dados.mala.length}</span></div>
          <div style={{ fontSize: 12, color: "var(--tinta2)" }}>itens conferidos</div>
        </div>
        <div className="barra" style={{ margin: "10px 0 0" }}><i style={{ width: (dados.mala.length ? (feitos / dados.mala.length) * 100 : 0) + "%" }}></i></div>
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <select value={cat} onChange={e => setCat(e.target.value)} style={{ flex: "0 0 40%" }}>{cats.map(c => <option key={c}>{c}</option>)}</select>
        <input value={novo} onChange={e => setNovo(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} placeholder="Novo item" />
        <button className="btn" onClick={add}>+</button>
      </div>

      {cats.filter(c => dados.mala.some(i => i.cat === c)).map(c => (
        <div key={c}>
          <div className="sec"><h2>{c}</h2><div className="risco"></div></div>
          <div className="card">
            {dados.mala.filter(i => i.cat === c).map(i => (
              <div key={i.id} className={"item" + (i.ok ? " on" : "")}>
                <button className={"cx" + (i.ok ? " on" : "")} onClick={() => alternar(i.id)}>{"\u2713"}</button>
                <div className="nm" style={{ flex: 1 }} onClick={() => alternar(i.id)}>{i.nome}</div>
                <button style={{ color: "var(--tinta3)", padding: 4 }} onClick={() => remover(i.id)}>{"\u2715"}</button>
              </div>
            ))}
          </div>
        </div>
      ))}
      <div style={{ height: 30 }}></div>
    </div>
  );
}

/* ------------------ ABA MAPA E LOCALIZACAO ------------------ */
function AbaMapa({ dados, acoes, ui, setUi, posFamilia }) {
  const ref = useRef(null), mapRef = useRef(null);
  useEffect(() => {
    if (!ref.current || mapRef.current || typeof L === "undefined") return;
    const m = L.map(ref.current, { attributionControl: false }).setView([13.7563, 100.5018], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(m);
    mapRef.current = m;
  }, []);
  useEffect(() => {
    const m = mapRef.current; if (!m) return;
    (m._camada || []).forEach(l => m.removeLayer(l));
    const camada = [], pontos = [];
    dados.checkins.forEach((c, idx) => {
      if (!c.lat) return;
      pontos.push([c.lat, c.lng]);
      const mk = L.circleMarker([c.lat, c.lng], { radius: 7, color: "#1F8F72", fillColor: "#1F8F72", fillOpacity: .85, weight: 2 })
        .bindPopup("<b>" + (c.titulo || "Ponto") + "</b><br>" + new Date(c.at).toLocaleString("pt-BR"));
      mk.addTo(m); camada.push(mk);
    });
    if (pontos.length > 1) { const l = L.polyline(pontos, { color: "#2C5C8F", weight: 2, dashArray: "5,6" }).addTo(m); camada.push(l); }
    if (posFamilia && posFamilia.lat) {
      const mk = L.circleMarker([posFamilia.lat, posFamilia.lng], { radius: 10, color: "#C8365B", fillColor: "#C8365B", fillOpacity: .9, weight: 3 }).bindPopup("Posicao atual");
      mk.addTo(m); camada.push(mk); pontos.push([posFamilia.lat, posFamilia.lng]);
    }
    m._camada = camada;
    if (pontos.length) m.fitBounds(pontos, { padding: [40, 40], maxZoom: 13 });
  }, [dados.checkins, posFamilia]);

  const linkFamilia = location.origin + location.pathname + "#familia";
  return (
    <div className="wrap">
      <div style={{ height: 12 }}></div>
      <div id="mapa" ref={ref}></div>

      <div className="card pad" style={{ marginTop: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1 }}>
            <h3 style={{ fontSize: 15 }}>Localizacao ao vivo</h3>

          </div>
          <button className={"pill" + (ui.rastreando ? " on" : "")} onClick={acoes.alternarRastreio}>{ui.rastreando ? "Ligado" : "Ligar"}</button>
        </div>
        {NUVEM ? (
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button className="btn sec" style={{ flex: 1 }} onClick={() => acoes.copiar(linkFamilia, "Link copiado")}>Copiar link da familia</button>
            <button className="btn sec" style={{ flex: 1 }} onClick={() => acoes.compartilhar("Acompanhe nossa viagem", linkFamilia)}>Enviar</button>
          </div>
        ) : <div className="aviso" style={{ marginTop: 12 }}>Para compartilhar a localizacao ao vivo, configure o Firebase em Ajustes. Sem isso, os check-ins ficam salvos so neste aparelho.</div>}
      </div>

      <div className="sec"><h2>Lugares visitados ({dados.checkins.length})</h2><div className="risco"></div>
        <button className="pill" onClick={acoes.exportarRota}>Exportar</button>
      </div>
      {dados.checkins.length === 0 && <div className="card pad vazio"><span className="ic">{"\uD83D\uDCCD"}</span>Nenhum check-in ainda. Use o botao Check-in na aba Agora quando chegar em um lugar.</div>}
      <div className="card">
        {dados.checkins.slice().reverse().map(c => (
          <div key={c.id} className="item">
            <span className="selo" style={{ flex: "0 0 auto" }}>{fmtDataCurta(c.at, fusoLocalDispositivo())}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 14 }}>{c.titulo}</div>
              <div style={{ fontSize: 11.5, color: "var(--tinta3)" }}>{new Date(c.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })} {c.cidade ? "\u00B7 " + c.cidade : ""}</div>
            </div>
            {c.lat && <a className="pill" href={"https://www.google.com/maps?q=" + c.lat + "," + c.lng} target="_blank" rel="noopener">Ver</a>}
          </div>
        ))}
      </div>
      <div style={{ height: 30 }}></div>
    </div>
  );
}

/* ------------------ VISAO DA FAMILIA (somente leitura) ------------------ */
function VisaoFamilia() {
  const [dados, setDados] = useState(null);
  const [pos, setPos] = useState(null);
  const [agora, setAgora] = useState(Date.now());
  const ref = useRef(null), mapRef = useRef(null);
  useEffect(() => {
    const t = setInterval(() => setAgora(Date.now()), 1000);
    if (NUVEM) {
      Nuvem.ref().onSnapshot(s => setDados(normalizar(s.data())));
      Nuvem.ouvirPosicao(setPos);
    } else setDados(normalizar(Local.ler()));
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    if (!ref.current || mapRef.current || typeof L === "undefined" || !pos) return;
    const m = L.map(ref.current, { attributionControl: false }).setView([pos.lat, pos.lng], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(m);
    mapRef.current = m;
  }, [pos]);
  useEffect(() => {
    if (mapRef.current && pos) {
      if (mapRef.current._mk) mapRef.current.removeLayer(mapRef.current._mk);
      mapRef.current._mk = L.circleMarker([pos.lat, pos.lng], { radius: 10, color: "#C8365B", fillColor: "#C8365B", fillOpacity: .9 }).addTo(mapRef.current);
      mapRef.current.setView([pos.lat, pos.lng]);
    }
  }, [pos]);

  if (!dados) return <div className="wrap"><div className="vazio">Carregando...</div></div>;
  const ord = dados.eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0));
  const atual = ord.find(e => { const i = inicioAbs(e), f = fimAbs(e); return i != null && agora >= i && agora < f; });
  const prox = ord.find(e => inicioAbs(e) > agora);
  const foco = atual || prox;
  return (
    <div>
      <div className="top"><div className="top-in">
        <div><h1>{dados.viagem.nome}</h1><div className="sub">Acompanhamento da familia</div></div>
      </div></div>
      <div className="wrap">
        <div style={{ height: 14 }}></div>
        <CartaoEmbarque evento={atual} proximo={prox} agora={agora} onAbrir={() => { }} dispositivoTz={fusoLocalDispositivo()} modoRelogio="local" />
        {pos && <>
          <div className="sec"><h2>Onde estao agora</h2><div className="risco"></div></div>
          <div id="mapaf" ref={ref} style={{ height: 260, borderRadius: 14, overflow: "hidden", border: "1px solid var(--linha)" }}></div>
          <div style={{ fontSize: 12, color: "var(--tinta2)", marginTop: 6 }}>Atualizado {new Date(pos.atualizadoEm).toLocaleString("pt-BR")}</div>
        </>}
        {foco && foco.cidade && <div className="card pad" style={{ marginTop: 14 }}><b>Cidade:</b> {foco.cidade}</div>}
        <div className="sec"><h2>Proximos passos</h2><div className="risco"></div></div>
        {ord.filter(e => fimAbs(e) > agora).slice(0, 8).map(e =>
          <ItemEvento key={e.id} e={e} agora={agora} onClick={() => { }} modoRelogio="local" dtz={fusoLocalDispositivo()} />)}
        <div style={{ height: 40 }}></div>
      </div>
    </div>
  );
}

/* ============================================================
   APLICACAO
   ============================================================ */
function App() {
  const [dados, setDados] = useState(() => normalizar(Local.ler()));
  const [aba, setAba] = useState("agora");
  const [agora, setAgora] = useState(Date.now());
  const [toast, setToast] = useState("");
  const [detalhe, setDetalhe] = useState(null);
  const [form, setForm] = useState(null);
  const [posFamilia, setPosFamilia] = useState(null);
  const [ui, setUi] = useState(() => {
    try { return Object.assign({ visao: "tudo", diaFoco: 0, filtroTipo: "todos", modoRelogio: "local", tema: "dia", aviso: 30, rastreando: false }, JSON.parse(localStorage.getItem(CONFIG.prefixo + "ui") || "{}")); }
    catch (e) { return { visao: "tudo", diaFoco: 0, filtroTipo: "todos", modoRelogio: "local", tema: "dia", aviso: 30, rastreando: false }; }
  });
  const arquivoRef = useRef(null), eventoFoto = useRef(null), watchRef = useRef(null);
  const avisados = useRef({});

  useEffect(() => { const t = setInterval(() => setAgora(Date.now()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => { document.documentElement.setAttribute("data-tema", ui.tema === "noite" ? "noite" : "dia"); localStorage.setItem(CONFIG.prefixo + "ui", JSON.stringify(Object.assign({}, ui, { rastreando: false }))); }, [ui]);
  useEffect(() => {
    if (!NUVEM) return;
    Nuvem.ref().get().then(s => { if (s.exists) { const d = normalizar(s.data()); if ((d.atualizadoEm || 0) > (dados.atualizadoEm || 0)) setDados(d); } });
    const un = Nuvem.ouvir(d => setDados(normalizar(d)));
    const un2 = Nuvem.ouvirPosicao(setPosFamilia);
    return () => { un && un(); un2 && un2(); };
  }, []);

  const salvar = useCallback((fn) => {
    setDados(prev => {
      const novo = typeof fn === "function" ? fn(prev) : fn;
      novo.atualizadoEm = Date.now();
      Local.gravar(novo);
      if (NUVEM) Nuvem.gravar(novo).catch(e => console.warn(e));
      return novo;
    });
  }, []);

  const aviso = (m) => { setToast(m); setTimeout(() => setToast(""), 2600); };

  // Notificacao de proximo evento
  useEffect(() => {
    if (!ui.aviso) return;
    const ord = dados.eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0));
    ord.forEach(e => {
      const i = inicioAbs(e); if (i == null) return;
      const falta = i - agora;
      if (falta > 0 && falta <= ui.aviso * 60000 && !avisados.current[e.id]) {
        avisados.current[e.id] = 1;
        aviso("Em " + Math.round(falta / 60000) + " min: " + e.titulo);
        if ("Notification" in window && Notification.permission === "granted") {
          try { new Notification(e.titulo, { body: "Comeca em " + Math.round(falta / 60000) + " minutos" }); } catch (x) { }
        }
      }
    });
  }, [agora, ui.aviso]);

  const acoes = {
    irPara: setAba,
    abrirEvento: (e) => setDetalhe(e.id),
    copiar: (txt, msg) => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(() => aviso(msg || "Copiado")); return; }
      } catch (e) { }
      const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); aviso(msg || "Copiado"); } catch (e) { aviso("Nao consegui copiar"); }
      document.body.removeChild(t);
    },
    compartilhar: (titulo, texto) => {
      if (navigator.share) navigator.share({ title: titulo, text: texto }).catch(() => { });
      else acoes.copiar(texto, "Copiado");
    },
    checkin: (e) => {
      const grava = (lat, lng) => {
        salvar(d => ({
          ...d,
          eventos: d.eventos.map(x => x.id === e.id ? { ...x, checkin: { at: Date.now(), lat, lng } } : x),
          checkins: [...d.checkins, { id: uid(), eventoId: e.id, titulo: e.titulo, cidade: e.cidade, at: Date.now(), lat, lng }]
        }));
        aviso("Check-in registrado");
      };
      if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => grava(p.coords.latitude, p.coords.longitude), () => grava(null, null), { timeout: 8000 });
      else grava(null, null);
    },
    pedirFoto: (e) => { eventoFoto.current = e.id; document.getElementById("inputFoto").click(); },
    anotar: (e) => {
      const t = prompt("O que esta acontecendo agora?", e.nota || "");
      if (t == null) return;
      salvar(d => ({ ...d, eventos: d.eventos.map(x => x.id === e.id ? { ...x, nota: t } : x) }));
      aviso("Anotado");
    },
    concluir: (e) => {
      salvar(d => ({ ...d, eventos: d.eventos.map(x => x.id === e.id ? { ...x, status: x.status === "concluido" ? "previsto" : "concluido" } : x) }));
      aviso(e.status === "concluido" ? "Reaberto" : "Concluido");
    },
    ligar: (e) => { if (e.contatoFone) location.href = "tel:" + e.contatoFone; else aviso("Sem telefone cadastrado neste evento"); },
    abrirMapa: (e) => {
      const u = e.mapsUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([e.endereco, e.localFim || e.localInicio, e.cidade].filter(Boolean).join(", "));
      window.open(u, "_blank");
    },
    alternarRastreio: () => {
      if (ui.rastreando) { navigator.geolocation.clearWatch(watchRef.current); setUi(u => ({ ...u, rastreando: false })); return; }
      if (!navigator.geolocation) return aviso("Sem GPS neste aparelho");
      watchRef.current = navigator.geolocation.watchPosition(p => {
        const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
        setPosFamilia(Object.assign({ atualizadoEm: Date.now() }, pos));
        if (NUVEM) Nuvem.posicao(pos).catch(() => { });
      }, () => aviso("Nao consegui acessar o GPS"), { enableHighAccuracy: true, maximumAge: 20000 });
      setUi(u => ({ ...u, rastreando: true }));
      aviso("Localizacao ao vivo ligada");
    },
    importarCsv: (txt) => {
      if (!txt.trim()) return;
      const linhas = txt.trim().split("\n").filter(l => l.trim());
      const novos = [];
      let ultimoDia = 0, ultimaData = dados.viagem.inicio;
      linhas.forEach(l => {
        const c = l.split("\t").length > 1 ? l.split("\t") : l.split(";");
        if (!c[5] && !c[3]) return;
        if (/dia/i.test(c[0]) && /data/i.test(c[1] || "")) return;
        const dia = c[0] && !isNaN(+c[0]) ? +c[0] : ultimoDia; ultimoDia = dia;
        let data = ultimaData;
        if (c[1]) {
          const m = c[1].match(/(\d{2})\/(\d{2})\/(\d{4})/) || c[1].match(/(\d{4})-(\d{2})-(\d{2})/);
          if (m) data = m[0].includes("/") ? m[3] + "-" + m[2] + "-" + m[1] : m[0];
        }
        ultimaData = data;
        novos.push(ev({
          dia, data, horaInicio: (c[2] || "").trim().slice(0, 5), duracaoMin: hm2min((c[3] || "").trim()),
          titulo: (c[5] || "Evento").trim(), localInicio: (c[6] || "").trim(), localFim: (c[7] || "").trim(),
          cidade: (c[8] || "").trim(), obs: (c[9] || "").trim(), tz: dados.viagem.fusoCasa,
          looks: { [(dados.viagem.viajantes[0] || {}).id]: (c[10] || "").trim(), [(dados.viagem.viajantes[1] || {}).id]: (c[11] || "").trim() }
        }));
      });
      if (!novos.length) return aviso("Nao encontrei linhas validas");
      salvar(d => ({ ...d, eventos: [...d.eventos, ...novos] }));
      aviso(novos.length + " eventos importados. Confira os fusos.");
    },
    exportarJson: () => {
      const b = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b);
      a.download = "roteiro-" + (dados.viagem.nome || "viagem").replace(/\s/g, "-") + ".json"; a.click();
    },
    importarJson: () => arquivoRef.current.click(),
    exportarRota: () => {
      const txt = dados.checkins.map(c => new Date(c.at).toLocaleString("pt-BR") + " - " + c.titulo + (c.cidade ? " (" + c.cidade + ")" : "") + (c.lat ? " https://maps.google.com/?q=" + c.lat + "," + c.lng : "")).join("\n");
      acoes.compartilhar("Nossa rota", txt || "Sem registros ainda");
    },
    exportarDiario: () => {
      const dias = [...new Set(dados.eventos.map(e => e.dia))].sort((a, b) => a - b);
      const txt = dias.map(d => legendaDoDia(d, dados.eventos, dados.viagem)).filter(Boolean).join("\n\n----------\n\n");
      acoes.compartilhar("Diario de viagem", txt);
    },
    compartilharRoteiro: () => {
      const ord = dados.eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0));
      let txt = dados.viagem.nome + "\n" + (dados.viagem.subtitulo || "") + "\n\n";
      let diaAtual = null;
      ord.forEach(e => {
        if (e.dia !== diaAtual) { diaAtual = e.dia; txt += "\nDIA " + e.dia + " - " + dataExtenso(e.data) + "\n"; }
        txt += fmtHora(inicioAbs(e), e.tz) + "  " + e.titulo + (e.cidade ? " (" + e.cidade + ")" : "") + "\n";
      });
      acoes.compartilhar("Nosso roteiro", txt);
    },
    exportarRoteiroHtml: () => {
      const ord = dados.eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0));
      let linhas = "";
      let diaAtual = null;
      ord.forEach(e => {
        if (e.dia !== diaAtual) { diaAtual = e.dia; linhas += "<h2>Dia " + e.dia + " - " + dataExtenso(e.data) + "</h2>"; }
        linhas += "<div class=e><b>" + fmtHora(inicioAbs(e), e.tz) + "</b> " + e.titulo
          + (e.cidade ? " <i>" + e.cidade + "</i>" : "")
          + (e.obs ? "<div class=o>" + e.obs + "</div>" : "") + "</div>";
      });
      const html = "<!doctype html><meta charset=utf-8><title>" + dados.viagem.nome + "</title>"
        + "<style>body{font-family:system-ui;max-width:680px;margin:30px auto;padding:0 16px;color:#16223A}h1{margin-bottom:0}h2{margin:26px 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:#5A6B84}.e{padding:8px 0;border-bottom:1px solid #eee}.o{font-size:13px;color:#5A6B84}</style>"
        + "<h1>" + dados.viagem.nome + "</h1><p>" + (dados.viagem.subtitulo || "") + "</p>" + linhas;
      const b = new Blob([html], { type: "text/html" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "roteiro.html"; a.click();
    },
    zerar: () => {
      if (!confirm("Isso apaga todos os eventos e registros deste aparelho. Continuar?")) return;
      const vazio = normalizar({ viagem: dados.viagem, eventos: [], mala: [], fotos: [], checkins: [] });
      salvar(vazio); aviso("Viagem zerada");
    }
  };

  const receberFoto = async (arq) => {
    if (!arq) return;
    aviso("Salvando foto...");
    const r = await enviarFoto(arq);
    if (!r) return aviso("Nao consegui ler a imagem");
    salvar(d => ({ ...d, fotos: [...d.fotos, Object.assign({ id: uid(), eventoId: eventoFoto.current, at: Date.now(), legenda: "" }, r)] }));
    aviso("Foto adicionada ao diario");
  };

  const evDetalhe = dados.eventos.find(e => e.id === detalhe);
  const dtz = fusoLocalDispositivo();
  const fusoAtualEvento = (() => {
    const ord = dados.eventos.slice().sort((a, b) => (inicioAbs(a) || 0) - (inicioAbs(b) || 0));
    const at = ord.find(e => { const i = inicioAbs(e), f = fimAbs(e); return i != null && agora >= i && agora < f; }) || ord.find(e => inicioAbs(e) > agora);
    return at ? at.tz : dtz;
  })();

  const abas = [
    ["agora", "\u23F1\uFE0F", "Agora"], ["roteiro", "\uD83D\uDCC5", "Roteiro"], ["diario", "\uD83D\uDCD6", "Diario"],
    ["mapa", "\uD83D\uDDFA\uFE0F", "Mapa"], ["mala", "\uD83C\uDF92", "Mala"], ["ajustes", "\u2699\uFE0F", "Ajustes"]
  ];

  return (
    <div>
      <div className="top"><div className="top-in">
        <div style={{ minWidth: 0 }}>
          <h1 style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{dados.viagem.nome}</h1>
          <div className="sub">{dados.viagem.subtitulo || CONFIG.marca.assinatura}</div>
        </div>
        <div className="relogios">
          <div className="r1 mono">{fmtHora(agora, ui.modoRelogio === "casa" ? dtz : fusoAtualEvento)}</div>
          <div className="r2">{ui.modoRelogio === "casa" ? "SEU CELULAR" : "NO DESTINO " + sigla(fusoAtualEvento)}</div>
        </div>
      </div></div>

      {aba === "agora" && <AbaAgora dados={dados} agora={agora} acoes={acoes} ui={ui} />}
      {aba === "roteiro" && <AbaRoteiro dados={dados} agora={agora} acoes={acoes} ui={ui} setUi={setUi} />}
      {aba === "diario" && <AbaDiario dados={dados} acoes={acoes} />}
      {aba === "mapa" && <AbaMapa dados={dados} acoes={acoes} ui={ui} setUi={setUi} posFamilia={posFamilia} />}
      {aba === "mala" && <AbaMala dados={dados} salvar={salvar} acoes={acoes} />}
      {aba === "ajustes" && <AbaAjustes dados={dados} salvar={salvar} acoes={acoes} ui={ui} setUi={setUi} />}

      {aba === "roteiro" && <button className="fab" onClick={() => setForm(ev({ id: "novo", data: hoje(), tz: fusoAtualEvento, dia: 0 }))}>+</button>}

      {evDetalhe && !form && (
        <DetalheEvento e={evDetalhe} dados={dados} agora={agora} acoes={acoes} modoRelogio={ui.modoRelogio}
          onFechar={() => setDetalhe(null)} onEditar={() => setForm(evDetalhe)} />
      )}
      {form && (
        <FormEvento evento={form} dados={dados}
          onSalvar={(f) => {
            const final = f.id === "novo" ? Object.assign({}, f, { id: uid() }) : f;
            if (!final.titulo.trim()) { aviso("Coloque um titulo antes de salvar"); return; }
            salvar(d => ({ ...d, eventos: d.eventos.some(x => x.id === final.id) ? d.eventos.map(x => x.id === final.id ? final : x) : [...d.eventos, final] }));
            try { localStorage.removeItem(CHAVE_RASCUNHO); } catch (e) { }
            setForm(null); setDetalhe(null); aviso("Evento salvo");
          }}
          onExcluir={(id) => { salvar(d => ({ ...d, eventos: d.eventos.filter(x => x.id !== id) })); try { localStorage.removeItem(CHAVE_RASCUNHO); } catch (e) { } setForm(null); setDetalhe(null); aviso("Evento excluido"); }}
          onFechar={() => setForm(null)} />
      )}

      <input id="inputFoto" type="file" accept="image/*" style={{ display: "none" }} onChange={e => { receberFoto(e.target.files[0]); e.target.value = ""; }} />
      <input ref={arquivoRef} type="file" accept="application/json" style={{ display: "none" }} onChange={e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { try { salvar(normalizar(JSON.parse(r.result))); aviso("Backup restaurado"); } catch (x) { aviso("Arquivo invalido"); } };
        r.readAsText(f); e.target.value = "";
      }} />

      {toast && <div className="toast">{toast}</div>}

      <nav><div className="in">
        {abas.map(([k, i, n]) => (
          <button key={k} className={aba === k ? "on" : ""} onClick={() => { setAba(k); window.scrollTo(0, 0); }}>
            <span className="ic">{i}</span><span className="tx">{n}</span>
          </button>
        ))}
      </div></nav>
    </div>
  );
}

const familia = location.hash.indexOf("familia") >= 0;
if (!familia && "Notification" in window && Notification.permission === "default") {
  setTimeout(() => { try { const r = Notification.requestPermission(); if (r && r.catch) r.catch(() => { }); } catch (e) { } }, 4000);
}
ReactDOM.createRoot(document.getElementById("root")).render(familia ? <VisaoFamilia /> : <App />);
</script>
</body>
</html>
