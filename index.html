<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}

.ev .tt{font-weight:600;font-size:0.9062em;line-height:1.25}
.ev .st{font-size:0.75em;color:var(--tinta2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tag{display:inline-block;font-size:0.5938em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--papel2);color:var(--tinta2);border:1px solid var(--linha);margin:6px 6px 0 0}
.ev .dir{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--tinta3);font-size:0.6875em}
.selo{color:var(--carimbo);border:2px solid var(--carimbo);border-radius:5px;font-family:'Space Mono',monospace;font-size:0.5312em;font-weight:700;padding:1px 4px;transform:rotate(-7deg);letter-spacing:.06em;opacity:.85}
@keyframes carimbar{0%{transform:scale(2.4) rotate(9deg);opacity:0}60%{transform:scale(.92) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-7deg)}}
.selo.novo{animation:carimbar .45s cubic-bezier(.2,1.4,.4,1)}

.giro{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--linha);border-top-color:var(--azul);animation:girar 1s linear infinite}
.marca{display:block}
.marca .orbita{transform-box:fill-box;transform-origin:50% 50%;animation:girar 1.8s linear infinite}
.marca-linha{display:flex;align-items:center;gap:9px}
.marca-nome{font-family:"Avenir Next",Avenir,Inter,sans-serif;font-weight:600;letter-spacing:-.02em}
@keyframes girar{to{transform:rotate(360deg)}}
.pontos::after{content:"";animation:pontinhos 1.4s steps(4,end) infinite}
@keyframes pontinhos{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.vazio{text-align:center;padding:44px 20px;color:var(--tinta2)}
.vazio .ic{font-size:2.125em;display:block;margin-bottom:10px;opacity:.5}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:0.75em;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--linha);background:var(--cartao);white-space:nowrap}
.pill.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.filtros{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;touch-action:pan-x;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
.filtros.quebra{flex-wrap:wrap;overflow-x:visible;-webkit-mask-image:none;mask-image:none}
.filtros::-webkit-scrollbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;background:var(--tinta);color:var(--papel);border:1px solid var(--tinta);border-radius:11px;padding:12px 16px;font-weight:700;font-size:0.875em;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--cartao);color:var(--tinta);border:1px solid var(--linha)}
.btn.perigo{background:var(--carimbo);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.5}

.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--tinta);color:var(--papel);font-size:1.625em;box-shadow:0 8px 24px rgba(22,34,58,.3);z-index:45;display:flex;align-items:center;justify-content:center}

html{height:100%}
body{min-height:100%;overscroll-behavior-y:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--cartao);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom);
  transform:translateZ(0);will-change:transform;backface-visibility:hidden}
@supports (height:100dvh){nav{top:auto;bottom:0}}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{padding:9px 2px 10px;text-align:center;color:var(--tinta3)}
nav button.on{color:var(--tinta)}
nav .ic{font-size:1.188em;display:block;line-height:1.2}
nav .tx{font-size:0.6562em;font-weight:700;letter-spacing:.02em}

.folha{position:fixed;inset:0;z-index:80;background:rgba(13,13,13,.5);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);overscroll-behavior:contain;touch-action:none}
.folha .in{background:var(--papel);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;border-radius:18px 18px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom));animation:sobe .26s cubic-bezier(.2,.9,.3,1)}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}}
.folha .cab{position:sticky;top:0;background:var(--papel);padding:14px 16px 10px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;z-index:2}
.folha .cab h3{font-size:1em;flex:1;min-width:0}
.folha .co{padding:14px 16px}
.puxador{width:38px;height:4px;border-radius:99px;background:var(--linha);margin:8px auto 0}

.campo{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:430px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:430px){.grid3{grid-template-columns:1fr 1fr 1fr}}

.linha-info{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:0.875em}
.linha-info .k{flex:0 0 96px;font-size:0.6875em;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta2);font-weight:700;padding-top:2px}
.linha-info .v{flex:1;min-width:0;word-break:break-word}

.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;background:var(--papel2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));background:var(--tinta);color:var(--papel);padding:11px 14px 11px 17px;border-radius:11px;font-size:0.8438em;font-weight:600;z-index:90;box-shadow:var(--sombra);max-width:92vw;text-align:center;display:flex;align-items:center;gap:12px}
.toast button{color:var(--papel);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 11px;font-size:0.7812em;font-weight:700;white-space:nowrap}
.visor{position:fixed;inset:0;z-index:95;background:rgba(8,12,20,.94);display:flex;flex-direction:column}
.visor img{flex:1;min-height:0;object-fit:contain;width:100%}
.visor .barra-v{padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
#mapa{height:calc(100dvh - var(--topo) - var(--nav) - 76px);min-height:300px;border-radius:var(--r);overflow:hidden;border:1px solid var(--linha)}
@supports not (height:100dvh){#mapa{height:calc(100vh - var(--topo) - var(--nav) - 76px)}}
.pin-dia{display:flex;align-items:center;justify-content:center;font-family:"Avenir Next",Avenir,Inter,sans-serif;
  font-size:11px;font-weight:700;color:#fff;background:var(--ambar);border:2px solid #fff;border-radius:99px;
  min-width:24px;height:24px;padding:0 5px;box-shadow:0 2px 6px rgba(13,13,13,.35)}
.pin-dia.visitado{background:var(--jade)}
.pin-dia.familia{background:var(--carimbo);min-width:16px;height:16px}
.pin-lugar{width:14px;height:14px;border-radius:99px;background:var(--cartao);border:3px solid var(--azul);box-shadow:0 1px 4px rgba(13,13,13,.3)}
.pop-lugar{font-size:13px;line-height:1.45;min-width:150px}
.pop-lugar span{color:#5C605C}
.pop-lugar .btn-add{margin-top:8px;width:100%;background:#0D0D0D;color:#E7E2DA;border:0;border-radius:9px;padding:8px 10px;font-weight:700;font-size:12.5px;cursor:pointer}
.leaflet-container{background:var(--papel2);font-family:"Avenir Next",Avenir,Inter,sans-serif}
.chip{display:inline-block;font-size:0.6875em;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--papel2);border:1px solid var(--linha);color:var(--tinta2);margin:0 5px 5px 0}
.item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.cx{width:23px;height:23px;flex:0 0 23px;border-radius:7px;border:2px solid var(--tinta3);display:flex;align-items:center;justify-content:center;font-size:0.8125em;color:transparent}
.cx.on{background:var(--jade);border-color:var(--jade);color:#fff}
.item.on .nm{text-decoration:line-through;color:var(--tinta3)}
.fita{position:relative;height:30px;border-radius:9px;background:var(--papel2);border:1px solid var(--linha);overflow:hidden;margin-top:4px}
.fita i{position:absolute;top:0;bottom:0;background:var(--tinta2);opacity:.55}
.fita b{position:absolute;top:0;bottom:0;background:var(--jade);box-shadow:0 0 0 1px var(--cartao) inset}
.fita u{position:absolute;top:0;bottom:0;width:1px;background:var(--linha)}
.fita s{position:absolute;top:0;bottom:0;width:2px;background:var(--tinta);opacity:.85;z-index:2}
.fita-fundo{position:relative;height:9px;border-radius:5px;background:var(--papel2);border:1px solid var(--linha);overflow:hidden;margin-bottom:3px}
.fita-fundo i{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--azul),var(--azul) 3px,transparent 3px,transparent 7px);opacity:.55}
.fita-lbl{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:0.5938em;color:var(--tinta3);margin-top:3px}
.vaga{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);margin-bottom:6px}
.vaga:active{transform:scale(.99)}
.vaga .hr{font-family:'Space Mono',monospace;font-weight:700;font-size:0.8125em}
.vaga .dr{margin-left:auto;font-size:0.7188em;font-weight:700;color:var(--jade);background:rgba(31,143,114,.12);padding:2px 8px;border-radius:99px}
.conflito{background:rgba(200,54,91,.1);border:1px solid var(--carimbo);color:var(--carimbo);border-radius:11px;padding:11px;font-size:0.7812em;margin-bottom:13px}
.aviso{background:var(--papel2);border:1px dashed var(--linha);border-radius:11px;padding:12px;font-size:0.7812em;color:var(--tinta2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:620px){
  .acoes{grid-template-columns:repeat(8,1fr)}
  .filtros{flex-wrap:wrap;overflow-x:visible}
}
@media(hover:hover) and (pointer:fine){
  .filtros{flex-wrap:wrap;overflow-x:visible}
}
</style>

// IndexedDB para fotos locais
const IDB = {
  db: null,
  abrir() {
    return new Promise((res, rej) => {
      if (IDB.db) return res(IDB.db);
      const r = indexedDB.open(CONFIG.prefixo + "fotos", 1);
      r.onupgradeneeded = () => {
        r.result.createObjectStore("f");
      };
      r.onsuccess = () => {
        IDB.db = r.result;
        res(IDB.db);
      };
      r.onerror = () => rej(r.error);
    });
  },
  async set(k, v) {
    const db = await IDB.abrir();
    return new Promise(r => {
      const t = db.transaction("f", "readwrite");
      t.objectStore("f").put(v, k);
      t.oncomplete = r;
    });
  },
  async get(k) {
    const db = await IDB.abrir();
    return new Promise(r => {
      const t = db.transaction("f", "readonly");
      const q = t.objectStore("f").get(k);
      q.onsuccess = () => r(q.result);
      q.onerror = () => r(null);
    });
  },
  async del(k) {
    const db = await IDB.abrir();
    return new Promise(r => {
      const t = db.transaction("f", "readwrite");
      t.objectStore("f").delete(k);
      t.oncomplete = r;
    });
  }
};

  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * esc);
  c.height = Math.round(bmp.height * esc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

}
